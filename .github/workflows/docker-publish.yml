# Build and publish the VTES Scanner Docker image to GHCR.
# Card images are fetched from the private vtesdecks-statics repo at build time;
# build_index.py runs inside the Docker builder stage so the final image contains
# only the pre-computed card_index.pkl (no raw images).

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for keyless signing with sigstore/fulcio outside PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sparse-checkout only the card images from the private vtesdecks-statics repo.
      # Requires a fine-grained PAT with read-only Contents access to vtesdecks-statics,
      # stored as secret STATICS_PAT in this repository.
      # Create it at: https://github.com/settings/personal-access-tokens/new
      #   → Resource owner: Zavierazo
      #   → Repository access: Only select repositories → vtesdecks-statics
      #   → Permissions: Contents = Read-only
      - name: Fetch card images from vtesdecks-statics
        run: |
          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            https://x-access-token:${{ secrets.STATICS_PAT }}@github.com/Zavierazo/vtesdecks-statics.git \
            /tmp/vtesdecks-statics
          cd /tmp/vtesdecks-statics
          git sparse-checkout set public/img/cards
          mkdir -p $GITHUB_WORKSPACE/img/cards
          cp -r /tmp/vtesdecks-statics/public/img/cards/. $GITHUB_WORKSPACE/img/cards/

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # Set up BuildKit Docker container builder to build multi-platform images
      # and export layer cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # The builder stage runs build_index.py; only the resulting card_index.pkl
      # is copied into the final runtime image.
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data. If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      # Call webhook to force redeploy
      - name: Deploy docker container webhook
        if: ${{ github.event_name != 'pull_request' }}
        uses: joelwmale/webhook-action@master
        env:
          WEBHOOK_URL: http://${{ secrets.WEBHOOK_HOST }}:${{ secrets.WEBHOOK_PORT }}/hooks/redeploy-vtes-scanner
          data: ""
