[uwsgi]
strict = true
master = true
http-socket = 0.0.0.0:5000
need-app = true
vacuum = true
die-on-term = true
exit-on-reload = true

; Load OpenCV and the index after fork, and allow the application's matching pool.
lazy-apps = true
enable-threads = true
single-interpreter = true

; serve.py supplies the initial/minimum and maximum process counts (default 1–3).
cheaper-algo = busyness
cheaper-step = 1
cheaper-overload = 15
cheaper-busyness-min = 20
cheaper-busyness-max = 70
cheaper-busyness-multiplier = 12
cheaper-busyness-penalty = 2
cheaper-busyness-backlog-alert = 33
cheaper-busyness-backlog-nonzero = 15
cheaper-busyness-backlog-step = 1
cheaper-busyness-backlog-multiplier = 12

; Bound request duration and let active requests finish during scale-down/stop.
harakiri = 60
worker-reload-mercy = 65
reload-mercy = 65
disable-logging = true
; Required for the optional native cheaper-rss-limit-soft threshold.
memory-report = true
